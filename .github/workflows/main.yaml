name: Java CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify MySQL connection
        run: |
          for i in {1..30}; do
            if mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u root \
              -proot \
              --silent; then
              echo "MySQL is ready"
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL did not become ready"
          exit 1

      - name: Build and Test
        env:
          SPRING_DATASOURCE_URL: >-
            jdbc:mysql://127.0.0.1:3306/testdb
            ?useSSL=false
            &serverTimezone=UTC
            &allowPublicKeyRetrieval=true
            &createDatabaseIfNotExist=true
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
        run: mvn --batch-mode clean verify

      - name: Generate JaCoCo Coverage Report
        run: mvn --batch-mode jacoco:report

      - name: Check Code Coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = "target/site/jacoco/jacoco.xml"
          required_coverage = 80.0

          try:
              root = ET.parse(report).getroot()
          except FileNotFoundError:
              print(f"ERROR: JaCoCo report not found: {report}")
              sys.exit(1)

          instruction_counter = next(
              (
                  counter
                  for counter in root.findall("counter")
                  if counter.attrib.get("type") == "INSTRUCTION"
              ),
              None,
          )

          if instruction_counter is None:
              print("ERROR: INSTRUCTION coverage data not found.")
              sys.exit(1)

          missed = int(instruction_counter.attrib["missed"])
          covered = int(instruction_counter.attrib["covered"])
          total = missed + covered

          if total == 0:
              print("ERROR: No instructions found in JaCoCo report.")
              sys.exit(1)

          coverage = (covered / total) * 100

          print(f"Code Coverage: {coverage:.2f}%")
          print(f"Required Coverage: {required_coverage:.2f}%")

          if coverage < required_coverage:
              print("QUALITY GATE FAILED")
              sys.exit(1)

          print("QUALITY GATE PASSED")
          PY

      # - name: SonarQube Analysis
      #   if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
      #   uses: SonarSource/sonarqube-scan-action@v7
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # - name: SonarQube Quality Gate
      #   if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
      #   uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 10
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Package JAR
        run: mvn --batch-mode package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: springboot-application
          path: target/*.jar
          if-no-files-found: error

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn