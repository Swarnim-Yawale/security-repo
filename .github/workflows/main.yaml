name: Java CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. Checkout source code
      # -----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------
      # 2. Setup JDK 21
      # -----------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -----------------------------------------
      # 3. Build and Run Unit Tests
      # -----------------------------------------
      - name: Build and Test
        run: |
          mvn clean verify

      # -----------------------------------------
      # 4. Generate / Verify JaCoCo Coverage
      # -----------------------------------------
      - name: Generate JaCoCo Coverage Report
        run: |
          mvn jacoco:report

      # -----------------------------------------
      # 5. Check Code Coverage >= 20%
      # -----------------------------------------
      - name: Check Code Coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import sys

          report = "target/site/jacoco/jacoco.xml"

          try:
              tree = ET.parse(report)
          except FileNotFoundError:
              print("ERROR: JaCoCo report not found:")
              print(report)
              sys.exit(1)

          root = tree.getroot()

          instruction_counter = None

          for counter in root.findall("counter"):
              if counter.attrib.get("type") == "INSTRUCTION":
                  instruction_counter = counter
                  break

          if instruction_counter is None:
              print("ERROR: INSTRUCTION coverage data not found.")
              sys.exit(1)

          missed = int(instruction_counter.attrib["missed"])
          covered = int(instruction_counter.attrib["covered"])

          total = missed + covered

          if total == 0:
              print("ERROR: No instructions found in JaCoCo report.")
              sys.exit(1)

          coverage = (covered / total) * 100

          print(f"Code Coverage: {coverage:.2f}%")
          print("Required Coverage: 20.00%")

          if coverage < 20:
              print("QUALITY GATE FAILED")
              print("Code coverage is below 20%.")
              sys.exit(1)

          print("QUALITY GATE PASSED")
          print("Code coverage is 20% or higher.")
          PY

      # -----------------------------------------
      # 6. SonarQube Analysis
      # -----------------------------------------
      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -----------------------------------------
      # 7. SonarQube Quality Gate
      # -----------------------------------------
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # -----------------------------------------
      # 8. Package Application
      # -----------------------------------------
      - name: Package JAR
        run: |
          mvn package -DskipTests

      # -----------------------------------------
      # 9. Upload JAR
      # -----------------------------------------
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-application
          path: target/*.jar

      # -----------------------------------------
      # 10. Upload JaCoCo Report
      # -----------------------------------------
      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/